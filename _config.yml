# Site configuration. The module and contributor docs are copied in from
# wicketstuff/core by scripts/fetch-docs.sh before every build; see
# .github/workflows/pages.yml.
title: Wicket Stuff
url: https://wicketstuff.org
markdown: kramdown
plugins:
  - jekyll-relative-links   # docs link to each other as foo.md, like on GitHub
relative_links:
  enabled: true
kramdown:
  input: GFM
  hard_wrap: false

# Release lines shown on the homepage. "lts" is the long-term support line:
# its branch provides the site's main documentation (/modules/) and its BOM
# is the default in the snippets. "current" is the newest feature line; its
# docs are published under /current/ (scripts/fetch-docs.sh finds the newest
# wicket-N.x branch by itself). Update the versions on every release, and
# move "lts" when a new LTS line starts (Wicket 14, July 2027).
releases:
  lts:
    version: 10.12.0
    wicket: "10"
    java: "17"
    servlet: Jakarta EE 10 (Servlet 6.0)
    branch: wicket-10.x
    supported_until: July 2027
  current:
    version: 11.0.0
    wicket: "11"
    java: "21"
    servlet: Jakarta EE 11 (Servlet 6.1)
    branch: wicket-11.x

# Modules shown first in the homepage catalog (before "Show all"), by
# directory name without "-parent". The rest follow alphabetically.
featured:
  - select2
  - wicketstuff-jquery-ui
  - inmethod-grid
  - shiro-security
  - datastores
  - datatables
  - tinymce6
  - wicketstuff-restannotations
  - wicketstuff-lazymodel
  - serializer-kryo2
  - minis
  - openlayers3

module_categories:
  ui: Components
  js: JavaScript libraries
  data: Data & reporting
  security: Security
  web: REST & web
  infra: Runtime
  dev: Developer tools

defaults:
  - scope: { path: "modules" }
    values: { layout: doc, section: modules }
  - scope: { path: "current" }
    values: { layout: doc, section: current }
  - scope: { path: "contribute" }
    values: { layout: doc, section: contribute }

exclude:
  - scripts
  - README.md
  - .gitignore
