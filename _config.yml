# Site configuration. The module and contributor docs are copied in from
# wicketstuff/core by scripts/fetch-docs.sh before every build; see
# .github/workflows/pages.yml.
title: Wicket Stuff
url: https://wicketstuff.org
markdown: kramdown
plugins:
  - jekyll-relative-links   # docs link to each other as foo.md, like on GitHub
relative_links:
  enabled: true
kramdown:
  input: GFM
  hard_wrap: false

# Release lines, shown in the homepage version table and on a page per line
# (/versions/<wicket>/, generated by scripts/release-lines.sh).
#   lts      the long-term support line: its branch provides the site's main
#            documentation (/modules/) and its BOM is the default in snippets
#   current  the newest feature line; its docs are published under /current/
#            (scripts/fetch-docs.sh finds the newest wicket-N.x branch itself)
#   ended    lines past their end of life, newest first
# Fields: version (latest release), wicket (major), java, servlet, branch;
# supported_until (month) and until_release (the release that ends support,
# see https://wicket.apache.org/versions/) for lts and current; ended (month)
# for ended lines; bom: false for a line without wicketstuff-bom. The BOM of
# every line that has one is read from Maven Central for the module
# availability strip and the added/removed modules on the line pages.
# Per release: update version. When a new feature line ships, move the old
# "current" to the top of "ended" (replace its support dates with ended:) and
# add the new line as "current" with its support dates. When a new LTS ships
# (Wicket 14, July 2027), it becomes "lts" and the old LTS moves to "ended".
releases:
  lts:
    version: 10.12.0
    wicket: "10"
    java: "17"
    servlet: Jakarta EE 10 (Servlet 6.0)
    branch: wicket-10.x
    supported_until: July 2027
    until_release: 14.0.0
  current:
    version: 11.0.0
    wicket: "11"
    java: "21"
    servlet: Jakarta EE 11 (Servlet 6.1)
    branch: wicket-11.x
    supported_until: January 2027
    until_release: 12.0.0
  ended:
    - version: 9.25.0
      wicket: "9"
      java: "11"
      servlet: Java EE (<code>javax.servlet</code> 3.1)
      branch: wicket-9.x
      bom: false
      ended: October 2026

# Modules shown first in the homepage catalog (before "Show all"), by
# directory name without "-parent". The rest follow alphabetically.
featured:
  - select2
  - wicketstuff-jquery-ui
  - inmethod-grid
  - shiro-security
  - datastores
  - datatables
  - tinymce6
  - wicketstuff-restannotations
  - wicketstuff-lazymodel
  - serializer-kryo2
  - minis
  - openlayers3

module_categories:
  ui: Components
  js: JavaScript libraries
  data: Data & reporting
  security: Security
  web: REST & web
  infra: Runtime
  dev: Developer tools

defaults:
  - scope: { path: "modules" }
    values: { layout: doc, section: modules }
  - scope: { path: "current" }
    values: { layout: doc, section: current }
  - scope: { path: "contribute" }
    values: { layout: doc, section: contribute }

exclude:
  - scripts
  - README.md
  - .gitignore
