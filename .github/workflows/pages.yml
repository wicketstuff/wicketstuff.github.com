# Builds wicketstuff.org: copies the module and developer docs from
# wicketstuff/core (see scripts/fetch-docs.sh), runs Jekyll and deploys
# to GitHub Pages. Runs on every push, nightly to pick up docs merged in
# core, and on demand.
name: Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      core_ref:
        description: "wicketstuff/core branch or tag to take the docs from"
        default: "wicket-11.x"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch docs from wicketstuff/core
        run: scripts/fetch-docs.sh
        env:
          CORE_REF: ${{ inputs.core_ref || 'wicket-11.x' }}
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
