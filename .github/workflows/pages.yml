# Builds wicketstuff.org: copies the module and developer docs from
# wicketstuff/core (see scripts/fetch-docs.sh), runs Jekyll and deploys
# to GitHub Pages. Jekyll runs from the Gemfile rather than through
# actions/jekyll-build-pages, so the plugins in _plugins/ run (the search
# index). Runs on every push, nightly to pick up docs merged in
# core, and on demand.
name: Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      lts_ref:
        description: "wicketstuff/core ref for the main (LTS) docs; empty uses releases.lts.branch from _config.yml"
        default: ""
        required: false
      current_ref:
        description: "wicketstuff/core ref for the current-line docs; empty uses the newest wicket-N.x branch"
        default: ""
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch docs from wicketstuff/core
        run: scripts/fetch-docs.sh
        env:
          LTS_REF: ${{ inputs.lts_ref }}
          CURRENT_REF: ${{ inputs.current_ref }}
      - uses: actions/configure-pages@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build -d _site
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
