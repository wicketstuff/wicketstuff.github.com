# Builds wicketstuff.org: copies the module and developer docs from
# wicketstuff/core (see scripts/fetch-docs.sh), runs Jekyll, builds the
# search index with Pagefind (scripts/pagefind.sh) and deploys to GitHub
# Pages. Runs on every push, nightly to pick up docs merged in
# core, and on demand.
name: Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      lts_ref:
        description: "wicketstuff/core ref for the main (LTS) docs; empty uses releases.lts.branch from _config.yml"
        default: ""
        required: false
      current_ref:
        description: "wicketstuff/core ref for the current-line docs; empty uses the newest wicket-N.x branch"
        default: ""
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch docs from wicketstuff/core
        run: scripts/fetch-docs.sh
        env:
          LTS_REF: ${{ inputs.lts_ref }}
          CURRENT_REF: ${{ inputs.current_ref }}
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      # jekyll-build-pages runs in a Docker container as root, so _site is
      # owned by root; hand it to the runner user so Pagefind can write
      # _site/pagefind/.
      - name: Build the search index
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          scripts/pagefind.sh _site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
